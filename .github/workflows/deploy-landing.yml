name: Build and deploy landing to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    name: Build and deploy landing site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "index.html missing in dist"; exit 1; }
          test -f dist/.htaccess || { echo ".htaccess missing in dist"; exit 1; }
          echo "Build OK"
          ls -la dist | head -20

      - name: Deploy to Namecheap via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false

      # Same build to the meets subdomain, through its own FTP account — that
      # login already lands inside the subdomain folder, so no traversal out of
      # the main site's home is needed. Stays a no-op until the credentials
      # exist, so adding the secrets is what switches the subdomain over.
      - name: Deploy to the meets subdomain via FTPS
        env:
          MEETS_USER: ${{ secrets.FTP_USERNAME_MEETS }}
        if: env.MEETS_USER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME_MEETS }}
          password: ${{ secrets.FTP_PASSWORD_MEETS }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
